# Builds the app with Trunk and publishes it to GitHub Pages. Kept as a reference for
# building courses.json: the live site sits behind Cloudflare Access, and Pages cannot
# require a login, so this only runs when started by hand (and is disabled in Settings).
# The Pages source must be set to "GitHub Actions" (Settings → Pages).
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  RUST_VERSION: "1.94.0"
  TRUNK_VERSION: "0.21.14" # 0.22 needs rustc >= 1.96
  TRUNK_SHA256: f2b4680cd239693a646a2795e4633c625328d7b2a044fbe749fa3a2fe9e7036b

jobs:
  build:
    runs-on: ubuntu-latest
    # Build scripts of third-party crates run here, so this job gets no write or OIDC
    # token permissions; configure-pages only reads the Pages settings.
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32-unknown-unknown

      - name: Install Trunk
        run: |
          curl -sSfL -o trunk.tar.gz "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz"
          echo "${TRUNK_SHA256}  trunk.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf trunk.tar.gz -C "$HOME/.local/bin" trunk
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/trunk" --version

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}

      - name: Test
        run: cargo test --locked

      - name: Build
        run: trunk build --release --locked --public-url "/${{ github.event.repository.name }}/"

      # Pages cannot proxy Pusun's course API (it sends no CORS headers), so save a
      # copy next to the page; the Courses section falls back to it. A failed fetch
      # only leaves Courses without data, it does not stop the deploy.
      - name: Save course list
        run: |
          if curl -sSf --retry 3 --max-time 30 -o courses.json https://app.api.pusuntech.com/TutorialBallWay/get \
             && jq -e 'type == "array" and length > 0' courses.json > /dev/null; then
            mv courses.json dist/courses.json
            echo "Saved $(jq length dist/courses.json) courses"
          else
            echo "::warning::Could not fetch the course list; Courses will show an error on the site"
          fi

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
