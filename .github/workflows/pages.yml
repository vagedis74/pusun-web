# Builds the app with Trunk and publishes it to GitHub Pages on every push to main.
# The Pages source must be set to "GitHub Actions" (Settings → Pages).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Weekly rebuild so the saved course list stays current.
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  RUST_VERSION: "1.94.0"
  TRUNK_VERSION: "0.21.14" # 0.22 needs rustc >= 1.96
  TRUNK_SHA256: f2b4680cd239693a646a2795e4633c625328d7b2a044fbe749fa3a2fe9e7036b

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32-unknown-unknown

      - name: Install Trunk
        run: |
          curl -sSfL -o trunk.tar.gz "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz"
          echo "${TRUNK_SHA256}  trunk.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf trunk.tar.gz -C "$HOME/.local/bin" trunk
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/trunk" --version

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}

      - name: Test
        run: cargo test --locked

      - name: Build
        run: trunk build --release --locked --public-url "/${{ github.event.repository.name }}/"

      # Pages cannot proxy Pusun's course API (it sends no CORS headers), so save a
      # copy next to the page; the Courses section falls back to it. A failed fetch
      # only leaves Courses without data, it does not stop the deploy.
      - name: Save course list
        run: |
          if curl -sSf --retry 3 --max-time 30 -o courses.json https://app.api.pusuntech.com/TutorialBallWay/get \
             && jq -e 'type == "array" and length > 0' courses.json > /dev/null; then
            mv courses.json dist/courses.json
            echo "Saved $(jq length dist/courses.json) courses"
          else
            echo "::warning::Could not fetch the course list; Courses will show an error on the site"
          fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
