[package]
name = "pusun-web"
version = "0.1.0"
edition = "2024"

[dependencies]
console_error_panic_hook = "0.1.7"
futures = "0.3.34"
gloo-net = { version = "0.8.0", default-features = false, features = ["http", "json"] }
gloo-timers = { version = "0.4.1", features = ["futures"] }
js-sys = "0.3.107"
leptos = { version = "0.8.23", features = ["csr"] }
serde = { version = "1.0.229", features = ["derive"] }
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
web-sys = { version = "0.3.107", features = ["Window", "Navigator", "Bluetooth", "BluetoothDevice", "BluetoothRemoteGattServer", "BluetoothRemoteGattService", "BluetoothRemoteGattCharacteristic", "BluetoothLeScanFilterInit", "RequestDeviceOptions", "Event", "EventTarget", "Storage", "Document", "Element"] }

[dev-dependencies]
serde_json = "1.0.154"
